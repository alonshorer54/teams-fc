[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 and TypeScript 6 need a modern Node; matches the GitHub Actions workflow
  NODE_VERSION = "22"

# Single-page app: every unknown path serves index.html so deep links and
# refreshes keep working instead of 404ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be served from cache, otherwise a phone can keep
# running an old build long after a new one shipped.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Hashed assets are immutable — safe to cache hard and forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
