[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 and TypeScript 6 need a modern Node.
  NODE_VERSION = "22"

# A photo shared to the app from the phone's gallery is posted here. The service worker normally catches
# it; this is for the minutes after a deploy when a phone still runs the old one.
[[redirects]]
  from = "/share-photo"
  to = "/?shared-photo"
  status = 303

# Single-page app: every unknown path serves index.html so deep links and
# refreshes keep working instead of 404ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be served from cache, otherwise a phone can keep
# running an old build long after a new one shipped.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Basic browser protections for every page. frame-ancestors stops another site from showing the
# app inside its own page and tricking a signed-in owner into tapping on it (clickjacking);
# the rest keep the app's address out of other sites' logs and stop content-type guessing.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Hashed assets are immutable — safe to cache hard and forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
